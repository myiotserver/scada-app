# Logrotate configuration for SCADA App PM2 logs
# Rotate monthly, keep 12 months of history, compress old logs
/home/ubuntu/applications/scada-app/logs/*.log {
    monthly
    rotate 12
    compress
    delaycompress
    missingok
    notifempty
    copytruncate
    dateext
    dateformat -%Y%m%d
    maxage 365
    su ubuntu ubuntu
}
