# =============================================================
# Fail2ban Filter — SCADA Application Login Failures
# Deploy ke: /etc/fail2ban/filter.d/scada-auth.conf
# =============================================================

[Definition]

# Matches log lines dari auth.controller.js saat login gagal
# Contoh log: "POST /api/auth/signin 401" dari express morgan
# Sesuaikan dengan format log PM2 / express di aplikasi

failregex = ^.*\[SCADA\].*signin.*failed.*<HOST>.*$
            ^.*POST /api/auth/signin.*(401|429).*<HOST>.*$

ignoreregex =

# Encoding
datepattern = {^LN-BEG}
